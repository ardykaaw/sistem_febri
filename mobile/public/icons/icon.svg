<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E8F82" />
      <stop offset="100%" stop-color="#064E46" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2FAF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Circular Glow -->
  <circle cx="256" cy="256" r="180" fill="#20C997" opacity="0.15" />

  <!-- Main Tooth & Medical Cross Graphic -->
  <g filter="url(#shadow)">
    <!-- Stylized Tooth Path -->
    <path d="M 256 120 
             C 210 120, 150 135, 150 200 
             C 150 240, 170 280, 185 330 
             C 195 365, 210 400, 228 400 
             C 242 400, 246 350, 256 350 
             C 266 350, 270 400, 284 400 
             C 302 400, 317 365, 327 330 
             C 342 280, 362 240, 362 200 
             C 362 135, 302 120, 256 120 Z" 
          fill="url(#toothGrad)" />

    <!-- Medical Health Plus in the center of tooth -->
    <path d="M 238 200 H 274 V 226 H 300 V 262 H 274 V 288 H 238 V 262 H 212 V 226 H 238 Z"
          fill="#0C7C70" rx="4" />
  </g>

  <!-- Modern Accent: Pulse / Queue Wave at bottom -->
  <path d="M 160 435 Q 208 425 256 435 T 352 435" 
        stroke="#20C997" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />
</svg>
